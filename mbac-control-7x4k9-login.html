<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Workshop Control — Moses Benz Auto Care</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="images/moses-benz-logo.png">
<style>
.admin-login-page{min-height:100vh;display:grid;place-items:center;padding:32px 18px;background:#f4f1ec}
.admin-login-card{width:min(460px,100%);background:#fff;border:1px solid #ddd7cf;border-radius:18px;padding:32px;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.admin-login-card .brand-login{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.admin-login-card .brand-login img{width:52px;height:52px;object-fit:contain}
.admin-login-card h1{margin:0 0 8px}
.admin-login-card p{color:#666;margin:0 0 24px}
.admin-login-form{display:grid;gap:16px}
.admin-login-form label{display:grid;gap:7px;font-weight:600}
.admin-login-form input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #cfc8bf;border-radius:10px;font:inherit}
.admin-login-form button{padding:13px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.admin-login-error{padding:12px;border-radius:10px;background:#fee9e7;color:#9d241b}
</style>
</head>
<body>
<main class="admin-login-page">
<section class="admin-login-card">
<div class="brand-login"><img src="images/moses-benz-logo.png" alt="Moses Benz Auto Care"><div><strong>Moses Benz Auto Care</strong><small style="display:block;color:#777">Workshop Control</small></div></div>
<h1>Admin sign in</h1>
<p>Enter the workshop administrator username and password.</p>
<form id="admin-login-form" class="admin-login-form">
<label>Username<input id="admin-username" name="username" autocomplete="username" required></label>
<label>Password<input id="admin-password" name="password" type="password" autocomplete="current-password" required></label>
<p id="admin-login-error" class="admin-login-error" hidden></p>
<button type="submit" class="btn btn-primary">Sign in</button>
</form>
</section>
</main>
<script src="js/supabase-config.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
