<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop Control — Moses Benz Auto Care</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><style>html,body{min-height:100%;background:#0c0e10;color:#fff}.admin-login-screen{min-height:100vh;display:grid;place-items:center;padding:24px}.admin-login-card{width:min(460px,100%);background:#111417;border:1px solid #333941;padding:42px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.admin-login-card h1{margin:12px 0;font-size:42px;text-transform:uppercase}.admin-login-card p{color:#aab1b9;line-height:1.6}.admin-login-card form{margin-top:28px;display:grid;gap:16px}.admin-login-card label{font:11px var(--font-mono);text-transform:uppercase;color:#aab1b9;display:grid;gap:8px}.admin-login-card input{padding:14px;background:#0c0e10;border:1px solid #3b424a;color:#fff}.admin-login-card input:focus{outline:1px solid #d11031}.gate-error{color:#ff7d95!important}.admin-login-brand{position:fixed;top:22px;left:24px}</style></head><body class="admin-body"><a class="admin-login-brand brand" href="/"><span class="brand-mark"><img src="images/logo.png" alt="Moses Benz Auto Care logo"></span><span class="brand-word">Moses Benz<small>Workshop Control</small></span></a><main class="admin-login-screen"><section class="admin-login-card"><span class="eyebrow">Staff Only</span><h1>Admin sign in</h1><p>Use the workshop username and password. Customer accounts are not used here.</p><form id="admin-login-form"><label>Username<input id="admin-username" name="username" required autocomplete="username"></label><label>Password<input id="admin-password" name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary btn-block" type="submit">Open control centre →</button><p id="admin-login-error" class="gate-error" hidden role="alert"></p></form></section></main><script src="js/supabase-config.js"></script><script src="js/auth.js"></script><script src="js/admin-login.js"></script></body></html>
